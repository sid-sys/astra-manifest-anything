name: astra
description: "A new Flutter project."
# The following line prevents the package from being accidentally published to
# pub.dev using `flutter pub publish`. This is preferred for private packages.
publish_to: 'none' # Remove this line if you wish to publish to pub.dev

# The following defines the version and build number for your application.
# A version number is three numbers separated by dots, like 1.2.43
# followed by an optional build number separated by a +.
# Both the version and the builder number may be overridden in flutter
# build by specifying --build-name and --build-number, respectively.
# In Android, build-name is used as versionName while build-number used as versionCode.
# Read more about Android versioning at https://developer.android.com/studio/publish/versioning
# In iOS, build-name is used as CFBundleShortVersionString while build-number is used as CFBundleVersion.
# Read more about iOS versioning at
# https://developer.apple.com/library/archive/documentation/General/Reference/InfoPlistKeyReference/Articles/CoreFoundationKeys.html
# In Windows, build-name is used as the major, minor, and patch parts
# of the product and file versions while build-number is used as the build suffix.
version: 1.0.7+43

environment:
  sdk: ^3.12.2

# Dependencies specify other packages that your package needs in order to work.
# To automatically upgrade your package dependencies to the latest versions
# consider running `flutter pub upgrade --major-versions`. Alternatively,
# dependencies can be manually updated by changing the version numbers below to
# the latest version available on pub.dev. To see which dependencies have newer
# versions available, run `flutter pub outdated`.
dependencies:
  flutter:
    sdk: flutter

  # The following adds the Cupertino Icons font to your application.
  # Use with the CupertinoIcons class for iOS style icons.
  cupertino_icons: ^1.0.8
  firebase_core: ^4.12.1
  firebase_auth: ^6.5.6
  cloud_firestore: ^6.7.1
  flutter_riverpod: ^2.6.1
  just_audio: ^0.10.6
  audio_service: ^0.18.19
  google_fonts: ^8.2.0
  intl: ^0.20.3
  shared_preferences: ^2.5.5
  cloud_functions: ^6.3.5
  image_picker: ^1.2.3
  in_app_purchase: ^3.3.0
  # Already present transitively; declared so the offer types can be imported.
  # A subscription with a free trial comes back from Play as several offers on
  # one product, and telling them apart needs the Android-side types.
  in_app_purchase_android: ^0.5.2
  url_launcher: ^6.3.2
  flutter_local_notifications: ^22.3.0
  timezone: ^0.11.1
  flutter_timezone: ^5.1.0
  firebase_messaging: ^16.5.0
  google_sign_in: ^7.2.0
dev_dependencies:
  flutter_test:
    sdk: flutter

  # The "flutter_lints" package below contains a set of recommended lints to
  # encourage good coding practices. The lint set provided by the package is
  # activated in the `analysis_options.yaml` file located at the root of your
  # package. See that file for information about deactivating specific lint
  # rules and activating additional ones.
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4
  flutter_native_splash: ^2.4.6
  image: ^4.9.1

# The launch screen, generated into the native projects rather than drawn by
# Flutter.
#
# It has to be native: the Flutter engine takes a second or two to start on a
# cold launch, and anything Dart draws cannot appear until it has. A splash
# written in Dart would arrive after the wait it exists to cover, which is why
# the first frame is an Android window background instead.
#
# Regenerate after changing anything here:
#   dart run flutter_native_splash:create
flutter_native_splash:
  # The same night the app is painted on, so the handover from the system
  # splash to the first screen is invisible.
  #
  # This was #F4EFE6 — the paper colour from before the app went dark — which
  # meant a cold launch flashed a cream screen and then dropped into a near
  # black one. The mark is drawn for the dark ground now, and so is this.
  color: "#6C3FD6"
  image: assets/brand/logo_mark.png

  # Android 12 replaced the window-background trick with its own splash API,
  # which ignores the drawable above and centres an icon in a circle instead.
  # Both are configured, because a phone on 11 and a phone on 14 take different
  # paths through this and only one of them is the one you are holding.
  #
  # A separate, much more padded image for this one specifically. Android 12's
  # splash icon is masked into a safe zone well inside the full canvas — the
  # first version used the same tightly-cropped mark as everywhere else, and
  # the OS clipped the birds and the ring around the figure at the edge. This
  # version fills only 48% of its canvas, with transparent margin the rest of
  # the way, so the mask has room to breathe.
  android_12:
    color: "#6C3FD6"
    image: assets/brand/logo_mark_splash.png
    icon_background_color: "#6C3FD6"

  # The web build is a development surface, not a product, and its own
  # index.html already paints while the bundle loads.
  web: false

# For information on the generic Dart part of this file, see the
# following page: https://dart.dev/tools/pub/pubspec

# The following section is specific to Flutter packages.
flutter:

  # iOS resolves native dependencies with CocoaPods, not Swift Package Manager.
  #
  # Under Swift Package Manager every Firebase plugin pins its own exact copy of
  # Apple's Firebase SDK, and they must all agree. The locked set does not:
  # firebase_auth, cloud_firestore and cloud_functions pin 12.15.0 while
  # firebase_core and firebase_messaging pin 12.17.0, so `xcodebuild` refuses
  # with "Could not resolve package dependencies" before compiling anything.
  #
  # CocoaPods reads one Firebase version from firebase_core and hands it to all
  # of them, so they cannot disagree. This changes only how the iOS project is
  # built — no package version moves, and the Android app is untouched.
  #
  # The proper fix is to upgrade the five Firebase plugins together, which does
  # change the Android app and so needs its own round of testing. When that is
  # done, this can come out.
  config:
    enable-swift-package-manager: false

  # The following line ensures that the Material Icons font is
  # included with your application, so that you can use the icons in
  # the material Icons class.
  uses-material-design: true

  # The logo, so Dart can draw the same mark the native splash showed a moment
  # earlier — see the waiting screen in app.dart.
  # logo_mark_splash.png is not listed here on purpose: it exists only for
  # `flutter_native_splash:create` to bake into native drawables, and is never
  # loaded at runtime by Dart. Bundling it would just add dead weight.
  assets:
    - assets/brand/logo_mark.png
    - assets/brand/night_sky.jpg
    - assets/brand/orb.webp
    - assets/brand/orb_still.png
    - assets/icons/
    - assets/animated/
    - assets/mascot/
    - assets/audio/meditation_bed.mp3

  # An image asset can refer to one or more resolution-specific "variants", see
  # https://flutter.dev/to/resolution-aware-images

  # For details regarding adding assets from package dependencies, see
  # https://flutter.dev/to/asset-from-package

  # To add custom fonts to your application, add a fonts section here,
  # in this "flutter" section. Each entry in this list should have a
  # "family" key with the font family name, and a "fonts" key with a
  # list giving the asset and other descriptors for the font. For
  # example:
  # fonts:
  #   - family: Schyler
  #     fonts:
  #       - asset: fonts/Schyler-Regular.ttf
  #       - asset: fonts/Schyler-Italic.ttf
  #         style: italic
  #   - family: Trajan Pro
  #     fonts:
  #       - asset: fonts/TrajanPro.ttf
  #       - asset: fonts/TrajanPro_Bold.ttf
  #         weight: 700
  #
  # For details regarding fonts from package dependencies,
  # see https://flutter.dev/to/font-from-package
