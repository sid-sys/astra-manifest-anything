# Launcher icons, generated from assets/brand/ by `dart run flutter_launcher_icons`.
#
# The sources are cropped from assets/brand/logo_source.png. The icon uses a
# tighter crop than the in-app mark on purpose: at 48dp the medallion's ring
# thins to a halo and the two hands read as red smudges, so the icon is the cat
# alone, which is the part that survives being small.
flutter_launcher_icons:
  android: "ic_launcher"

  # Apple rejects an icon with an alpha channel outright, and says so only after
  # the upload. The source is opaque already; this makes it a guarantee rather
  # than a property of one particular PNG.
  ios: true
  remove_alpha_ios: true
  image_path: "assets/brand/icon.png"

  # Adaptive icons are two layers the launcher animates and masks
  # independently. The background is the app's own night, not white: the cat is
  # dark purple and gold, drawn to sit on that, and on white it loses its edges.
  # The same picture as the Play Store icon: it is the background layer, with an
  # empty foreground, so the launcher shows the store icon exactly.
  adaptive_icon_background: "assets/brand/icon_adaptive_bg.png"
  adaptive_icon_foreground: "assets/brand/icon_adaptive_fg.png"

  # Play requires a 512x512 icon for the listing; this writes one so the store
  # asset and the launcher asset cannot drift apart.
  web:
    generate: true
    image_path: "assets/brand/icon.png"
    background_color: "#6C3FD6"
    theme_color: "#6C3FD6"
